services:
  - type: web
    name: giftsniper
    runtime: python
    pythonVersion: 3.12
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: IS_DOMAIN
        value: "true"
    routes:
      - path: /
        matchType: prefix
