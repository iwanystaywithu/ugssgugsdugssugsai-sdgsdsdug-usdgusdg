# Netlify configuration - FAQAT STATIC FILES
[build]
  publish = "static"
  command = "echo 'Static files only - backend deployed separately'"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# API requests to backend (o'zgartirib qo'ying your-backend-url bilan)
[[redirects]]
  from = "/api/*"
  to = "https://your-backend.onrender.com/api/:splat"
  status = 200
  force = false

